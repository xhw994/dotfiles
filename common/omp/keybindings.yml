# Each action lists every encoding one key can arrive as: cmux sends emacs forms
# (see unix/cmux/cmux.json), Linux terminals send modifier forms.
tui.editor.cursorWordLeft: [alt+left, alt+b]
tui.editor.cursorWordRight: [alt+right, alt+f]
tui.editor.cursorLineStart: [ctrl+left, ctrl+a, home]
tui.editor.cursorLineEnd: [ctrl+right, ctrl+e, end]
tui.editor.deleteWordBackward: [alt+backspace, ctrl+w]
tui.editor.deleteWordForward: [alt+delete, alt+d]
tui.editor.deleteToLineStart: [ctrl+backspace, ctrl+u]
tui.editor.deleteToLineEnd: [ctrl+delete, ctrl+k]

app.model.selectTemporary: [Alt+P, Alt+O]
